<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UI Sketch</title>
  <link rel="stylesheet" href="editor.css" />
</head>
<body>

  <!-- ===================== TOOLBAR ===================== -->
  <header id="toolbar">

    <div class="tool-group">
      <label class="field">
        Stroke
        <input type="color" id="stroke-color" value="#1b1c20" />
      </label>
      <label class="field">
        Fill
        <input type="color" id="fill-color" value="#3a5bd9" />
      </label>
      <label class="field checkbox">
        <input type="checkbox" id="fill-enabled" />
        filled
      </label>
      <label class="field">
        Width
        <input type="range" id="stroke-width" min="1" max="12" value="2" />
      </label>
    </div>

    <div class="tool-group" id="effects-group">
      <label class="field" title="Rounded corners (rectangles only)">
        Radius
        <input type="range" id="corner-radius" min="0" max="60" value="0" />
      </label>
      <label class="field" title="Applies to the selected shape, or the next one you draw">
        Opacity
        <input type="range" id="opacity" min="0" max="100" value="100" />
      </label>
      <button id="effects-btn" title="Effects: shadows, blurs, noise, texture, glass, shader">Effects <span id="effects-count" class="badge hidden">0</span></button>
      <label class="field checkbox">
        <input type="checkbox" id="gradient-enabled" />
        gradient
      </label>
      <label class="field hidden" id="gradient-to-field">
        to
        <input type="color" id="gradient-to-color" value="#1c2b6b" />
      </label>
      <label class="field checkbox" title="Dashed stroke">
        <input type="checkbox" id="dashed-enabled" />
        dashed
      </label>
      <label class="field checkbox" title="Right-angle routing for connectors">
        <input type="checkbox" id="elbow-enabled" />
        elbow
      </label>
      <label class="field" title="Text size">
        Size
        <input type="number" id="font-size" min="8" max="400" value="18" />
      </label>
      <label class="field" title="Polygon sides / star points">
        Points
        <input type="number" id="shape-count" min="3" max="60" value="5" />
      </label>
      <label class="field" title="Star inner radius, % of the outer radius">
        Inner
        <input type="number" id="shape-inner" min="5" max="95" value="50" />
      </label>
      <label class="field" title="Rotation in degrees (rectangles, ellipses, images, text)">
        Rotate
        <input type="number" id="rotation" min="-180" max="180" value="0" />
      </label>
    </div>

    <div class="tool-group" id="arrange-group">
      <button class="icon-btn" data-align="left" title="Align left"><svg viewBox="0 0 16 16"><path d="M2 1v14"/><rect x="4" y="3" width="10" height="3"/><rect x="4" y="9" width="6" height="3"/></svg></button>
      <button class="icon-btn" data-align="hcenter" title="Align horizontal centres"><svg viewBox="0 0 16 16"><path d="M8 1v14"/><rect x="3" y="3" width="10" height="3"/><rect x="5" y="9" width="6" height="3"/></svg></button>
      <button class="icon-btn" data-align="right" title="Align right"><svg viewBox="0 0 16 16"><path d="M14 1v14"/><rect x="2" y="3" width="10" height="3"/><rect x="6" y="9" width="6" height="3"/></svg></button>
      <button class="icon-btn" data-align="top" title="Align top"><svg viewBox="0 0 16 16"><path d="M1 2h14"/><rect x="3" y="4" width="3" height="10"/><rect x="9" y="4" width="3" height="6"/></svg></button>
      <button class="icon-btn" data-align="vcenter" title="Align vertical centres"><svg viewBox="0 0 16 16"><path d="M1 8h14"/><rect x="3" y="3" width="3" height="10"/><rect x="9" y="5" width="3" height="6"/></svg></button>
      <button class="icon-btn" data-align="bottom" title="Align bottom"><svg viewBox="0 0 16 16"><path d="M1 14h14"/><rect x="3" y="2" width="3" height="10"/><rect x="9" y="6" width="3" height="6"/></svg></button>
      <button class="icon-btn" data-distribute="x" title="Distribute horizontally (3+ shapes)"><svg viewBox="0 0 16 16"><path d="M2 1v14M14 1v14"/><rect x="6" y="4" width="4" height="8"/></svg></button>
      <button class="icon-btn" data-distribute="y" title="Distribute vertically (3+ shapes)"><svg viewBox="0 0 16 16"><path d="M1 2h14M1 14h14"/><rect x="4" y="6" width="8" height="4"/></svg></button>
      <button id="group-btn" title="Group (Ctrl+G)">Group</button>
      <button id="ungroup-btn" title="Ungroup (Ctrl+Shift+G)">Ungroup</button>
    </div>

    <div class="tool-group">
      <button id="undo-btn" title="Undo (Ctrl+Z)">Undo</button>
      <button id="redo-btn" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button id="clear-btn" title="Clear canvas">Clear</button>
    </div>

    <div class="tool-group" id="zoom-group">
      <button id="zoom-out" title="Zoom out (Ctrl −)">−</button>
      <button id="zoom-label" title="Reset to 100% (Ctrl 0)">100%</button>
      <button id="zoom-in" title="Zoom in (Ctrl +)">+</button>
      <button id="zoom-fit" title="Fit all content (Shift 1)">Fit</button>
      <button id="layers-toggle" title="Show / hide the layers panel">Layers</button>
    </div>

    <div class="tool-group export-group">
      <span class="hint">Drop or paste a screenshot to add it as a reference</span>
      <label class="field">
        Send via
        <select id="export-mode">
          <option value="local">Local file</option>
          <option value="mcp">MCP server</option>
        </select>
      </label>
      <label class="field" id="folder-field">
        Folder
        <input type="text" id="export-folder" value="ui-sketches" spellcheck="false" />
      </label>
      <label class="field" id="agent-path-field" title="Where your agent sees the files. In a VMware Fusion VM with a shared folder this is like /mnt/hgfs/sketches. Leave empty if the agent runs on this computer and uses the folder above.">
        Agent path
        <input type="text" id="agent-path" placeholder="optional, e.g. /mnt/hgfs/sketches" spellcheck="false" />
      </label>
      <button id="copy-prompt-btn" title="Copies a ready-to-paste message telling your agent where the sketch is">Copy agent prompt</button>
      <button id="connection-btn" class="hidden" title="Where does your coding agent run? This computer, a VM, or another computer">
        <span id="connection-dot" class="dot"></span> Agent connection: <span id="connection-label">this computer</span>
      </button>
      <button id="export-btn" class="primary">Send to project</button>
      <span id="export-status"></span>
    </div>

    <!-- Developer Companion Tools -->
    <div class="tool-group companion-group" id="companion-group">
      <button id="github-dashboard-btn" class="companion-btn" title="Open GitHub Repo Dashboard">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub Dashboard
      </button>

      <button id="send-logs-btn" class="companion-btn accent" title="Send captured browser console & network logs to the coding agent">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M13 2H3a1 1 0 00-1 1v10a1 1 0 001 1h10a1 1 0 001-1V3a1 1 0 00-1-1z"/>
          <path d="M5 6h6M5 9h4"/>
          <path d="M11 11l3-3-3-3"/>
        </svg>
        Send browser logs to agent
        <span id="logs-badge" class="companion-badge hidden">0</span>
      </button>

      <button id="view-logs-btn" class="companion-btn icon-only" title="View live captured browser logs">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M2 3h12M2 7h12M2 11h8"/>
        </svg>
      </button>
    </div>

  </header>

  <!-- ===================== CANVAS ===================== -->
  <div id="workspace">
    <main id="canvas-wrap">
      <canvas id="board"></canvas>
      <!-- Hidden text input used only while placing/editing a text shape -->
      <input type="text" id="text-input" class="hidden" spellcheck="false" />
      <input type="file" id="image-picker" accept="image/*" multiple hidden />

      <!-- Comment box (comments.js) -->
      <div id="comment-popover" class="hidden">
        <div class="cm-head"><span id="cm-title">Comment</span><button id="cm-close" class="fx-icon" title="Close">×</button></div>
        <textarea id="cm-text" rows="3" placeholder="Add a note for your agent…"></textarea>
        <div class="cm-actions">
          <button id="cm-resolve" class="cm-btn">Resolve</button>
          <button id="cm-delete" class="cm-btn">Delete</button>
          <span class="cm-spacer"></span>
          <button id="cm-post" class="cm-btn primary">Post</button>
        </div>
      </div>

      <!-- Figma-style floating tool dock (built by dock.js) -->
      <nav id="dock" aria-label="Tools"></nav>

      <!-- Effects popover (opened from the toolbar's Effects button) -->
      <section id="effects-panel" class="hidden" aria-label="Effects">
        <header class="fx-head">
          <span id="fx-title">Effects</span>
          <button id="fx-add" class="fx-icon" title="Add effect">+</button>
          <button id="fx-close" class="fx-icon" title="Close">×</button>
        </header>
        <div id="fx-menu" class="hidden"></div>
        <div id="fx-scope" class="fx-scope"></div>
        <div id="fx-list"></div>
      </section>
    </main>

    <aside id="layers">
      <div class="layers-head">Layers</div>
      <div id="layers-list"></div>
    </aside>

    <aside id="inspect-panel" class="hidden">
      <div class="layers-head">Inspect <span class="insp-badge">Dev mode · read-only</span></div>
      <div id="inspect-body"></div>
    </aside>
  </div>

  <!-- Actions palette (Ctrl/Cmd+K) — built by actions.js -->
  <div id="actions-modal" class="hidden">
    <div class="actions-box" role="dialog" aria-label="Actions">
      <input id="actions-input" type="text" placeholder="Search actions…" autocomplete="off" spellcheck="false" />
      <div id="actions-list" role="listbox"></div>
    </div>
  </div>

  <!-- GitHub Dashboard Modal / Drawer -->
  <div id="github-modal" class="companion-modal hidden">
    <div class="companion-modal-backdrop"></div>
    <div class="companion-modal-panel">
      <div class="companion-modal-header">
        <div class="modal-title-group">
          <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          <span>GitHub Repository Dashboard</span>
        </div>
        <div class="modal-actions">
          <button id="github-popout-btn" class="companion-icon-btn" title="Open in separate window">↗ Pop out</button>
          <button id="github-close-btn" class="companion-icon-btn" title="Close">×</button>
        </div>
      </div>
      <iframe id="github-iframe" src="../overlay/overlay.html"></iframe>
    </div>
  </div>

  <!-- Browser Logs Drawer -->
  <div id="logs-modal" class="companion-modal hidden">
    <div class="companion-modal-backdrop"></div>
    <div class="companion-modal-panel logs-panel">
      <div class="companion-modal-header">
        <div class="modal-title-group">
          <span class="status-indicator live"></span>
          <span>Captured Browser Logs & Diagnostics</span>
          <span id="logs-count-label" class="badge">0 logs</span>
        </div>
        <div class="modal-actions">
          <button id="logs-flush-agent-btn" class="primary-btn">⚡ Push to Agent Server</button>
          <button id="logs-clear-btn" class="companion-icon-btn" title="Clear local logs">Clear</button>
          <button id="logs-popout-btn" class="companion-icon-btn" title="Open full viewer">↗ Pop out</button>
          <button id="logs-close-btn" class="companion-icon-btn" title="Close">×</button>
        </div>
      </div>
      <div class="logs-filter-bar">
        <input type="text" id="logs-search" placeholder="Filter logs by keyword, url or app..." />
        <div class="logs-filter-pills">
          <label><input type="checkbox" id="filter-errors" checked /> Errors</label>
          <label><input type="checkbox" id="filter-warns" checked /> Warnings</label>
          <label><input type="checkbox" id="filter-info" checked /> Info/Console</label>
          <label><input type="checkbox" id="filter-network" checked /> Network 4xx/5xx</label>
        </div>
      </div>
      <div id="logs-list-view" class="logs-content-area"></div>
    </div>
  </div>

  <!-- Companion Floating Toast -->
  <div id="companion-toast" class="companion-toast hidden"></div>

  <script type="module" src="main.js"></script>
  <script type="module" src="companion-bridge.js"></script>
</body>
</html>
